<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Keuangan Anisa & Erama</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased pb-24">

    <!-- HEADER BIRU ELEGAN -->
    <header class="bg-blue-600 text-white pt-5 pb-16 px-4 rounded-b-3xl shadow-md relative">
        <div class="max-w-md mx-auto flex justify-between items-center mb-4">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-white/10 rounded-xl flex items-center justify-center border border-white/20">
                    <i class="fa-solid fa-wallet text-amber-300"></i>
                </div>
                <span class="font-black tracking-wider text-sm">Finansialku</span>
            </div>
            <div class="flex items-center gap-4 text-xs font-medium text-blue-100">
                <span class="hover:text-white cursor-pointer"><i class="fa-solid fa-house mr-1"></i>Home</span>
                <span class="hover:text-white cursor-pointer"><i class="fa-solid fa-headset mr-1"></i>Support</span>
                <span class="hover:text-white cursor-pointer"><i class="fa-solid fa-user mr-1"></i>Akun</span>
            </div>
        </div>
    </header>

    <div class="max-w-md mx-auto px-4 -mt-12 space-y-4 relative z-10">
        
        <!-- LOADING SPINNER -->
        <div id="loading" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center">
            <div class="bg-white p-5 rounded-2xl shadow-xl flex flex-col items-center gap-2">
                <i class="fa-solid fa-circle-notch text-blue-600 text-2xl animate-spin"></i>
                <p class="text-xs font-semibold text-slate-500">Menyinkronkan...</p>
            </div>
        </div>

        <!-- KARTU SALDO MENGAMBANG (Floating Card ala Finansialku) -->
        <div class="bg-white p-5 rounded-2xl shadow-lg border border-slate-100 space-y-3">
            <div class="flex justify-between items-center border-b border-slate-100 pb-2.5">
                <span class="text-xs text-slate-400 font-medium">Pemasukan</span>
                <span id="totalPemasukan" class="text-xs sm:text-sm font-bold text-slate-700">Rp 0</span>
            </div>
            <div class="flex justify-between items-center border-b border-slate-100 pb-2.5">
                <span class="text-xs text-slate-400 font-medium">Pengeluaran</span>
                <span id="totalPengeluaranCard" class="text-xs sm:text-sm font-bold text-rose-600">-Rp 0</span>
            </div>
            <div class="flex justify-between items-center pt-1">
                <span class="text-xs text-blue-600 font-bold uppercase tracking-wider">Saldo Saat Ini</span>
                <span id="sisaSaldo" class="text-base sm:text-lg font-black text-blue-600">Rp 0</span>
            </div>
        </div>

        <!-- MENU GRID IKON (Shortcut Cepat ala Referensi) -->
        <div class="bg-white p-4 rounded-2xl shadow-xs border border-slate-100 grid grid-cols-4 gap-3 text-center">
            <button onclick="toggleModalForm(true)" class="flex flex-col items-center gap-1.5 group cursor-pointer">
                <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg group-hover:bg-blue-600 group-hover:text-white transition shadow-2xs">
                    <i class="fa-solid fa-file-pen"></i>
                </div>
                <span class="text-[10px] font-semibold text-slate-600">Catat</span>
            </button>
            <button onclick="document.getElementById('filterDompet').focus()" class="flex flex-col items-center gap-1.5 group cursor-pointer">
                <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center text-lg group-hover:bg-amber-600 group-hover:text-white transition shadow-2xs">
                    <i class="fa-solid fa-vault"></i>
                </div>
                <span class="text-[10px] font-semibold text-slate-600">Dompet</span>
            </button>
            <button onclick="document.getElementById('filterBulan').focus()" class="flex flex-col items-center gap-1.5 group cursor-pointer">
                <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg group-hover:bg-emerald-600 group-hover:text-white transition shadow-2xs">
                    <i class="fa-solid fa-calendar-days"></i>
                </div>
                <span class="text-[10px] font-semibold text-slate-600">Bulanan</span>
            </button>
            <button onclick="resetDataTotal()" class="flex flex-col items-center gap-1.5 group cursor-pointer">
                <div class="w-12 h-12 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center text-lg group-hover:bg-rose-600 group-hover:text-white transition shadow-2xs">
                    <i class="fa-solid fa-rotate-right"></i>
                </div>
                <span class="text-[10px] font-semibold text-slate-600">Reset</span>
            </button>
        </div>

        <!-- RINGKASAN GRAFIK KECIL -->
        <div class="bg-white p-4 rounded-2xl shadow-xs border border-slate-100 flex items-center justify-between gap-4">
            <div>
                <h3 class="text-xs font-bold text-slate-800">Proporsi Pengeluaran</h3>
                <p class="text-[10px] text-slate-400">Berdasarkan kategori bulan ini.</p>
            </div>
            <div class="w-16 h-16 flex-shrink-0">
                <canvas id="grafikKategori"></canvas>
            </div>
        </div>

        <!-- DAFTAR RIWAYAT TRANSAKSI -->
        <div class="bg-white rounded-2xl shadow-xs border border-slate-100 overflow-hidden">
            <div class="p-3.5 border-b border-slate-100 bg-slate-50 flex items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                    <select id="filterBulan" class="p-1 text-[11px] border border-slate-200 rounded-lg bg-white font-medium focus:outline-blue-500">
                        <option value="Semua">Semua Bulan</option>
                    </select>
                    <select id="filterDompet" class="p-1 text-[11px] border border-slate-200 rounded-lg bg-white font-medium focus:outline-blue-500">
                        <option value="Semua">Semua Dompet</option>
                        <option value="Dompet Bersama">🏦 Bersama</option>
                        <option value="Pribadi Suami">👨 Erama</option>
                        <option value="Pribadi Istri">👩 Anisa</option>
                    </select>
                </div>
                <span id="totalItemText" class="text-[10px] font-bold text-slate-400 uppercase">0 Item</span>
            </div>

            <!-- CONTAINER LIST -->
            <div id="mobileList" class="divide-y divide-slate-100 p-3 space-y-2"></div>
        </div>
    </div>

    <!-- MODAL POPUP FORM INPUT -->
    <div id="formModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-end justify-center transition-all">
        <div class="bg-white w-full max-w-md rounded-t-3xl p-5 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                <h3 class="text-sm font-bold text-slate-800 flex items-center gap-1.5">
                    <i class="fa-solid fa-pen-to-square text-blue-600"></i> Catat Transaksi Baru
                </h3>
                <button onclick="toggleModalForm(false)" class="text-slate-400 hover:text-slate-600 p-1 text-sm cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <form id="formPengeluaran" class="space-y-3 text-xs">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Tanggal</label>
                        <input type="date" id="tanggal" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs" required>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Jenis</label>
                        <select id="jenis" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs" onchange="sesuaiFormKategori()">
                            <option value="Pengeluaran">💸 Pengeluaran</option>
                            <option value="Pemasukan">💰 Pemasukan</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Dompet</label>
                        <select id="dompet" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                            <option value="Dompet Bersama">🏦 Dompet Bersama</option>
                            <option value="Pribadi Suami">👨 Dompet Erama</option>
                            <option value="Pribadi Istri">👩 Dompet Anisa</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Kategori</label>
                        <select id="kategori" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs"></select>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-3">
                    <div class="col-span-1">
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Jumlah (Rp)</label>
                        <input type="number" id="jumlah" placeholder="Nominal" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs" required>
                    </div>
                    <div class="col-span-2">
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Keterangan</label>
                        <input type="text" id="keperluan" placeholder="Misal: Beli token listrik" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs" required>
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-md transition flex items-center justify-center gap-1.5 text-xs cursor-pointer mt-2">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Simpan ke Cloud
                </button>
            </form>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION BAR (Menu Navigasi Bawah ala Mobile App) -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2 px-6 flex justify-around items-center z-40 max-w-md mx-auto shadow-lg">
        <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="flex flex-col items-center text-blue-600 gap-0.5 cursor-pointer">
            <i class="fa-solid fa-house text-base"></i>
            <span class="text-[9px] font-bold">Home</span>
        </button>
        <button onclick="toggleModalForm(true)" class="flex flex-col items-center text-white bg-blue-600 w-12 h-12 rounded-full -mt-6 shadow-md justify-center text-lg hover:bg-blue-700 transition cursor-pointer border-4 border-white">
            <i class="fa-solid fa-plus"></i>
        </button>
        <button onclick="alert('Fitur Laporan Bulanan akan hadir di pembaruan berikutnya!')" class="flex flex-col items-center text-slate-400 hover:text-blue-600 gap-0.5 cursor-pointer">
            <i class="fa-solid fa-chart-pie text-base"></i>
            <span class="text-[9px] font-medium">Laporan</span>
        </button>
    </div>

    <script>
        // ISI DENGAN URL GOOGLE APPS SCRIPT YANG LAMA MILIKMU
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzua4xTJBLO3GmdUEdkpt5aCnsZeqs_dPjSXn9g-Q-QGJrmwkA9H8CkQbyNYozF9PTl/exec"; 

        let daftarTransaksi = [];
        const daftarKategori = ['Jajan', 'Makan', 'Bensin', 'Sosial', 'Rumah Tangga', 'Belanja', 'Liburan', 'Lain-lain'];
        const ikonKategori = { 'Jajan': '🍿', 'Makan': '🍔', 'Bensin': '⛽', 'Sosial': '🤝', 'Rumah Tangga': '🏠', 'Belanja': '🛍️', 'Liburan': '✈️', 'Lain-lain': '🌀', 'Pemasukan': '💰' };
        const ikonDompet = { 'Dompet Bersama': '🏦', 'Pribadi Suami': '👨', 'Pribadi Istri': '👩' };

        const ctx = document.getElementById('grafikKategori').getContext('2d');
        const grafik = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: daftarKategori,
                datasets: [{
                    data: [0, 0, 0, 0, 0, 0, 0, 0],
                    backgroundColor: ['#3b82f6', '#f43f5e', '#eab308', '#10b981', '#8b5cf6', '#f97316', '#ec4899', '#64748b']
                }]
            },
            options: { plugins: { legend: { display: false } }, cutout: '70%', responsive: true, maintainAspectRatio: false }
        });

        function formatRupiah(angka) { 
            const absNominal = Math.abs(parseInt(angka));
            return 'Rp ' + absNominal.toLocaleString('id-ID'); 
        }
        function formatTanggalIndo(tglStr) { return new Date(tglStr).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }); }
        function dapatkanBulanTahun(tanggalStr) { return new Date(tanggalStr).toLocaleDateString('id-ID', { month: 'long', year: 'numeric' }); }
        function showLoading(status) { document.getElementById('loading').classList.toggle('hidden', !status); }
        
        function toggleModalForm(buka) {
            document.getElementById('formModal').classList.toggle('hidden', !buka);
            if(buka) {
                document.getElementById('tanggal').value = new Date().toISOString().split('T')[0];
            }
        }

        function sesuaiFormKategori() {
            const jenis = document.getElementById('jenis').value;
            const selectKat = document.getElementById('kategori');
            selectKat.innerHTML = '';
            
            if (jenis === 'Pengeluaran') {
                daftarKategori.forEach(k => {
                    selectKat.innerHTML += `<option value="${k}">${ikonKategori[k] || ''} ${k}</option>`;
                });
            } else {
                selectKat.innerHTML = `<option value="Pemasukan">💰 Pemasukan</option>`;
            }
        }

        async function muatDataDariCloud() {
            if(!SCRIPT_URL || SCRIPT_URL.includes("GANTI")) return;
            showLoading(true);
            try {
                const respon = await fetch(SCRIPT_URL);
                daftarTransaksi = await respon.json();
                daftarTransaksi.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));
                perbaruiDropdownBulan();
                perbaruiTampilan();
            } catch (err) { console.error(err); } 
            finally { showLoading(false); }
        }

        function perbaruiDropdownBulan() {
            const selectBulan = document.getElementById('filterBulan');
            const terpilih = selectBulan.value;
            let bulanUnik = [];
            daftarTransaksi.forEach(t => {
                const bln = dapatkanBulanTahun(t.tanggal);
                if(bln && !bulanUnik.includes(bln)) bulanUnik.push(bln);
            });
            selectBulan.innerHTML = '<option value="Semua">Semua Bulan</option>';
            bulanUnik.forEach(b => { selectBulan.innerHTML += `<option value="${b}">${b}</option>`; });
            selectBulan.value = terpilih;
        }

        function perbaruiTampilan() {
            const mobileList = document.getElementById('mobileList');
            const filterBulan = document.getElementById('filterBulan').value;
            const filterDompet = document.getElementById('filterDompet').value;
            
            mobileList.innerHTML = '';
            
            let totalPemasukanBulanIni = 0;
            let totalPengeluaranBulanIni = 0;
            let dataGrafik = [0, 0, 0, 0, 0, 0, 0, 0];
            let hitungItem = 0;

            daftarTransaksi.forEach(function(t, index) {
                const blnTx = dapatkanBulanTahun(t.tanggal);
                const cocokBulan = (filterBulan === "Semua" || filterBulan === blnTx);
                const cocokDompet = (filterDompet === "Semua" || filterDompet === t.dompet);

                if (cocokBulan && cocokDompet) {
                    hitungItem++;
                    const nilai = parseInt(t.jumlah || 0);
                    const apakahPemasukan = (nilai < 0 || t.kategori === 'Pemasukan');
                    
                    if (apakahPemasukan) {
                        totalPemasukanBulanIni += Math.abs(nilai);
                    } else {
                        totalPengeluaranBulanIni += nilai;
                        const idx = daftarKategori.indexOf(t.kategori);
                        if (idx !== -1) dataGrafik[idx] += nilai;
                    }

                    const warnaTeksJumlah = apakahPemasukan ? "text-emerald-600 font-bold" : "text-slate-800 font-bold";
                    const tandaDiferensiasi = apakahPemasukan ? "+ " : "- ";

                    const card = document.createElement('div');
                    card.className = "flex justify-between items-center py-2 bg-white transition";
                    card.innerHTML = `
                        <div class="flex items-center gap-2.5 min-w-0">
                            <div class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-sm flex-shrink-0 border border-slate-100">
                                ${ikonKategori[t.kategori] || '💰'}
                            </div>
                            <div class="min-w-0">
                                <div class="font-bold text-slate-800 text-xs truncate">${t.keperluan}</div>
                                <div class="text-[9px] text-slate-400 font-semibold mt-0.5">
                                    ${formatTanggalIndo(t.tanggal)} • ${ikonDompet[t.dompet] || '💳'} ${t.dompet.replace("Pribadi ", "")}
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 flex-shrink-0">
                            <div class="${warnaTeksJumlah} text-xs sm:text-sm text-right">${tandaDiferensiasi}${formatRupiah(nilai)}</div>
                            <button onclick="hapusTransaksi(${index})" class="text-slate-300 hover:text-rose-500 p-1.5 text-xs transition cursor-pointer"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    `;
                    mobileList.appendChild(card);
                }
            });

            document.getElementById('totalPemasukan').innerText = 'Rp ' + totalPemasukanBulanIni.toLocaleString('id-ID');
            document.getElementById('totalPengeluaranCard').innerText = '-Rp ' + totalPengeluaranBulanIni.toLocaleString('id-ID');
            
            const saldoBersih = totalPemasukanBulanIni - totalPengeluaranBulanIni;
            const elSaldo = document.getElementById('sisaSaldo');
            elSaldo.innerText = (saldoBersih < 0 ? '- ' : '') + 'Rp ' + Math.abs(saldoBersih).toLocaleString('id-ID');

            document.getElementById('totalItemText').innerText = hitungItem + " Item";
            grafik.data.datasets[0].data = dataGrafik;
            grafik.update();
        }

        document.getElementById('filterBulan').addEventListener('change', perbaruiTampilan);
        document.getElementById('filterDompet').addEventListener('change', perbaruiTampilan);

        document.getElementById('formPengeluaran').addEventListener('submit', function(e) {
            e.preventDefault();
            const jenis = document.getElementById('jenis').value;
            let inputJumlah = parseInt(document.getElementById('jumlah').value);
            
            if (jenis === 'Pemasukan') { inputJumlah = -Math.abs(inputJumlah); }

            const dataBaru = {
                tanggal: document.getElementById('tanggal').value,
                jumlah: inputJumlah,
                kategori: document.getElementById('kategori').value,
                keperluan: document.getElementById('keperluan').value,
                dompet: document.getElementById('dompet').value
            };

            daftarTransaksi.push(dataBaru);
            daftarTransaksi.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));
            
            perbaruiDropdownBulan();
            perbaruiTampilan();
            document.getElementById('formPengeluaran').reset();
            sesuaiFormKategori();
            toggleModalForm(false);

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dataBaru)
            });
        });

        async function hapusTransaksi(indexGlobal) {
            if(!confirm("Hapus catatan ini secara permanen?")) return;
            const target = daftarTransaksi[indexGlobal];
            showLoading(true);

            daftarTransaksi.splice(indexGlobal, 1);
            perbaruiDropdownBulan();
            perbaruiTampilan();

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: "delete",
                        tanggal: target.tanggal,
                        jumlah: target.jumlah,
                        keperluan: target.keperluan,
                        dompet: target.dompet
                    })
                });
            } catch (err) { console.error(err); } 
            finally { showLoading(false); }
        }

        async function resetDataTotal() {
            if(!confirm("⚠️ Hapus TOTAL seluruh catatan keuangan di Google Sheets?")) return;
            showLoading(true);
            daftarTransaksi = [];
            perbaruiDropdownBulan();
            perbaruiTampilan();
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "reset" })
                });
            } catch (err) { console.error(err); } 
            finally { showLoading(false); }
        }

        sesuaiFormKategori();
        muatDataDariCloud();
    </script>
</body>
</html>
